[project]
name = "l2tca"
version = "0.1.0"
description = "Real-time L2 order book reconstruction and execution cost analysis (TCA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
    "polars>=1.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# Plotting is optional so a capture host installs nothing it does not need.
plot = ["matplotlib>=3.8"]

[project.scripts]
l2tca = "l2tca.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l2tca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "core: exercises the hand-written core (book / signals / tca). These FAIL by design until the core is implemented -- they are the development target. Deselected by default; run them with `pytest -m core`.",
]
# Default run covers the infrastructure only, so a green bar means "the
# scaffolding still works". The core suite is red on purpose and is opted into.
addopts = "-ra --strict-markers -m 'not core'"
filterwarnings = ["error::DeprecationWarning:l2tca.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
