[project]
name = "l2tca"
version = "0.1.0"
description = "Real-time L2 order book reconstruction and execution cost analysis (TCA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
    "polars>=1.0",
    "pyarrow>=17.0",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
# Plotting is optional so a capture host installs nothing it does not need.
plot = ["matplotlib>=3.8"]

[project.scripts]
l2tca = "l2tca.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l2tca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "core: exercises the hand-written core (book / signals / tca), as opposed to the infrastructure around it. Isolate with `pytest -m core` while working on one of those modules.",
]
# No marker filter here on purpose. A filter in addopts is applied to every
# invocation, including the explicit node ids an IDE passes when you click one
# test -- which silently deselects it instead of running it. Filtering belongs
# on the command line, where it is visible:
#   pytest                 -> everything. What CI runs.
#   pytest -m core         -> the core suite alone.
#   pytest -m "not core"   -> the infrastructure suite alone.
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:l2tca.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
